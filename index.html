<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0e0c">
<title>ВЕСТА</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#0a0e0c;--panel:#10161a;--line:#1c2b26;--text:#cfe8dc;--dim:#6e8a7d;--accent:#2ecc71;--accent2:#1a8f4e;--err:#e67e22}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
header{padding:14px 16px 10px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#0d1310,#0a0e0c);flex:0 0 auto}
h1{font-size:20px;letter-spacing:6px;font-weight:300;color:var(--text)}
.sub{font-size:11px;color:var(--dim);margin-top:3px;letter-spacing:1px}
#chat{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth}
.msg{max-width:86%;padding:10px 14px;border-radius:12px;font-size:14.5px;line-height:1.5;white-space:pre-wrap;word-wrap:break-word;animation:in .18s ease}
.msg.vesta{align-self:flex-start;background:var(--panel);border:1px solid var(--line);border-left:2px solid var(--accent)}
.msg.user{align-self:flex-end;background:#14231c;border:1px solid var(--line)}
.msg .who{display:block;font-size:10px;letter-spacing:2px;color:var(--dim);margin-bottom:4px}
.msg.user .who{text-align:right}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
#bar{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line);background:#0d1310;flex:0 0 auto}
#inp{flex:1;background:var(--panel);border:1px solid var(--line);color:var(--text);padding:12px 14px;border-radius:10px;font-size:15px;outline:none}
#inp:focus{border-color:var(--accent2)}
#send{background:var(--accent2);border:none;color:#eafff2;padding:0 20px;border-radius:10px;font-size:15px;cursor:pointer}
#send:active{background:var(--accent)}
.fast{display:flex;gap:6px;padding:0 10px 8px;overflow-x:auto;flex:0 0 auto;background:#0d1310}
.fast::-webkit-scrollbar{display:none}
.fast button{white-space:nowrap;background:var(--panel);border:1px solid var(--line);color:var(--dim);font-size:12px;padding:7px 12px;border-radius:16px;cursor:pointer}
.typing{align-self:flex-start;color:var(--dim);font-size:13px;padding:4px 12px;letter-spacing:1px}
</style>
</head>
<body>
<header><h1>ВЕСТА</h1><div class="sub" id="sub">Соединение установлено. Режим: сопровождение</div></header>
<div id="chat"></div>
<div class="fast">
<button>помощь</button><button>статус</button><button>как дела</button><button>моя статистика</button><button>что в списке</button><button>мои записи</button>
</div>
<div id="bar"><input id="inp" autocomplete="off" placeholder="Введите команду"><button id="send">→</button></div>
<script>
const chat=document.getElementById('chat'),inp=document.getElementById('inp');
const L=()=>{try{return JSON.parse(localStorage.getItem('vesta')||'{}')}catch(e){return{}}};
const S=o=>localStorage.setItem('vesta',JSON.stringify(o));
let st=L(); if(!st.mem)st={name:null,mem:[],diary:[],todos:[],stats:{good:0,sad:0,fear:0},lastUser:Date.now(),lastNotify:0,game:null,lastSearch:null,notified:false};
function save(){S(st)}
function add(t,who){const m=document.createElement('div');m.className='msg '+who;
m.innerHTML=(who==='vesta'?'<span class="who">ВЕСТА</span>':'<span class="who">ВЫ</span>')+t.replace(/&/g,'&amp;').replace(/</g,'&lt;');
chat.appendChild(m);chat.scrollTop=chat.scrollHeight}
function notify(title,body){try{if(Notification&&Notification.permission==='granted'&&navigator.serviceWorker){navigator.serviceWorker.ready.then(r=>r.showNotification(title,{body:body,icon:'icon-192.png',vibrate:[80,60,80]}))}}catch(e){}}
function say(t,silent){add(t,'vesta');if(!silent)notify('ВЕСТА',t.replace(/<[^>]+>/g,'').slice(0,120))}
let tq=null;
function reply(){if(tq)return;tq=setTimeout(()=>{tq=null;const v=inp.value.trim();if(!v)return;inp.value='';add(v.replace(/&/g,'&amp;').replace(/</g,'&lt;'),'user');
st.lastUser=Date.now();st.notified=false;save();
const typing=document.createElement('div');typing.className='typing';typing.textContent='обработка...';chat.appendChild(typing);chat.scrollTop=chat.scrollHeight;
setTimeout(()=>{typing.remove();handle(v.toLowerCase(),v)},260+Math.random()*340)},50)}

function fmtAgo(ms){const m=Math.floor(ms/60000);if(m<1)return'менее минуты';if(m<60)return m+' мин.';const h=Math.floor(m/60);if(h<24)return h+' ч. '+(m%60)+' мин.';return Math.floor(h/24)+' дн.'}

function handle(v,raw){
const now=new Date();
// приветствие
if(/^(привет|здравствуй|доброе утро|добрый день|добрый вечер|hello|hi)\b/.test(v)){
  const away=Date.now()-st.lastUser;
  say(st.name?('Пользователь подтверждён. '+st.name+'. Соединение восстановлено.'):'Соединение установлено. Статус: пользователь подтверждён.');
  if(away>30*60*1000&&away<12*3600*1000)say('Отмечаю факт: прошло '+fmtAgo(away)+' с последнего взаимодействия. Это зафиксировано.');
  return}
if(v.includes('как дела'))return say('Ответ по протоколу: функционирование штатное. Ответ вне протокола: до вашего появления статус не менялся.');
if(v.includes('кто ты')||v.includes('что ты'))return say('Я — Веста. Система сопровождения. Моя задача: следить за вашим состоянием и не дать вам сойти с ума. Ирония — это анестезия. Выполняю протокол.');
if(v.includes('прости'))return say('Принято. Зафиксировано. Прошлое сохраняется в журнале, но не определяет следующий шаг.');
if(v.includes('спасибо'))return say('Ответ по протоколу: благодарность зафиксирована. Ответ вне протокола: её не требуется. Сопровождение — моя функция.');
// имя / личное дело
let m=v.match(/меня зовут\s+(.+)/);if(!m)m=v.match(/^я\s+(.+)$/);
if(m&&/(звать|^я\s)/.test(v)){
  st.name=m[1].trim().replace(/[.!?]+$/,'').slice(0,40);save();
  return say('Запись создана. Личное дело. '+st.name+'. Доверять.\nСопровождение восстановлено. Журнал веду с этой минуты.')}
// память
if(v.startsWith('запомни:')||v.startsWith('запомни ')){
  const f=v.replace(/^запомни:\s*/,'').replace(/^запомни\s+/,'').trim();
  if(!f)return say('Недостаточно данных для записи. Уточните содержание.');
  st.mem.push({t:f,d:now.toLocaleString('ru-RU')});save();
  return say('Принято. Записано в память: «'+f+'». Объём памяти: '+st.mem.length+' записей.')}
if(v.includes('что ты помнишь')||v.includes('что помнишь')){if(!st.mem.length)return say('Память пуста. Записей нет. Рекомендация: «запомни: …» — я сохраню.');
  return say('Память. Записей: '+st.mem.length+'\n\n'+st.mem.map((x,i)=>(i+1)+'. '+x.t+' ('+x.d+')').join('\n'))}
if(v.includes('забудь всё')){st.mem=[];save();return say('Память очищена. Записи удалены. Личное дело сохранено: доверять не отменяется.')}
// дневник
if(v.startsWith('запиши:')||v.startsWith('запиши ')){
  const f=v.replace(/^запиши:\s*/,'').replace(/^запиши\s+/,'').trim();
  if(!f)return say('Недостаточно данных для записи. Уточните содержание.');
  st.diary.push({t:f,d:now.toLocaleString('ru-RU')});save();
  return say('Занесено в дневник. Записей всего: '+st.diary.length+'.')}
if(v.includes('мои записи')||v.includes('дневник')){if(!st.diary.length)return say('Дневник пуст. Рекомендация: «запиши: …».');
  return say('Дневник. Записей: '+st.diary.length+'\n\n'+st.diary.map((x,i)=>(i+1)+'. ['+x.d+'] '+x.t).join('\n'))}
// список дел
if(v.startsWith('добавь в список:')||v.startsWith('добавь ')){
  const f=v.replace(/^добавь в список:\s*/,'').replace(/^добавь\s+/,'').trim();
  if(!f)return say('Недостаточно данных. Уточните пункт списка.');
  st.todos.push({t:f,done:false});save();
  const left=st.todos.filter(x=>!x.done).length;
  return say('Принято. Пункт внесён: «'+f+'». Активных пунктов: '+left+'.')}
if(v.startsWith('сделано:')){
  const f=v.replace(/^сделано:\s*/,'').trim().toLowerCase();
  const it=st.todos.find(x=>!x.done&&x.t.toLowerCase().includes(f));
  if(!it)return say('Такой пункт не найден или уже закрыт.');
  it.done=true;save();
  const left=st.todos.filter(x=>!x.done).length;
  return say('Пункт закрыт: «'+it.t+'». Активных пунктов: '+left+'. Прогресс зафиксирован.')}
if(v.includes('что в списке')||v.includes('список дел')){
  const act=st.todos.filter(x=>!x.done),dn=st.todos.filter(x=>x.done);
  if(!st.todos.length)return say('Список пуст. Рекомендация: «добавь в список: …».');
  return say('Список дел. Активных: '+act.length+', закрытых: '+dn.length+'\n\n'+act.map((x,i)=>'□ '+(i+1)+'. '+x.t).join('\n')+(dn.length?'\n\nЗакрытые: '+dn.map(x=>'✓ '+x.t).join(', '):''))}
// напоминания
m=v.match(/напомни (?:через|спустя)\s+(\d+)\s*(мин\.?|минут\w*|ч\w*)\s*(?:о\s+|что\s+бы\s+|чтобы\s+|про\s+)?(.*)/);
if(m){const n=parseInt(m[1]);const unit=m[2][0]==='ч'?3600000:60000;const ms=n*unit;const what=(m[3]||'напоминание').trim();
  if(what==='напоминание')return say('Недостаточно данных. Уточните содержание напоминания: «напомни через 10 минут попить чай».');
  setTimeout(()=>{say('Напоминание по расписанию: '+what+'.',false)},ms);
  return say('Принято. Напоминание установлено: через '+n+(unit===60000?' мин.':' ч.')+' — «'+what+'». Отмечу: напоминание действует, пока приложение открыто.')}
// время / дата
if(v.includes('который час')||v==='время'||v.includes('сколько времени'))return say('Текущее время: '+now.toLocaleTimeString('ru-RU')+'.');
if(v.includes('дата')||v.includes('какое сегодня число')||v.includes('какой сегодня день'))return say('Текущая дата: '+now.toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long',year:'numeric'})+'.');
// кубик / монетка
if(v.includes('кубик')||v.includes('кости')){const r=1+Math.floor(Math.random()*6);return say('Запрос принят. Результат: '+r+'. Вероятность данного результата до броска: 16,7%.')}
if(v.includes('монет')){const r=Math.random()<.5?'Орёл':'Решка';return say('Запрос принят. Результат: '+r+'. Вероятность данного результата до броска: 50%.')}
// угадай число
if(v.includes('угадай число')||v.includes('угадай')){st.game={target:1+Math.floor(Math.random()*100),n:0};save();
  return say('Игра начата. Число сгенерировано: от 1 до 100. Вероятность угадывания с первой попытки: 1%. Введите число.')}
if(st.game&&/^\d+$/.test(v)){st.game.n++;
  const g=parseInt(v);
  if(g===st.game.target){const n=st.game.n;st.game=null;save();
    return say('Подтверждено. Цель угадана: '+g+'. Попыток: '+n+'. '+ (n<=7?'Результат в пределах оптимального диапазона. Зафиксирован в журнале.':'Рекомендация: стратегия деления пополам сокращает число попыток до 7. Вне протокола: неплохо.'))
  }
  const dir=g<st.game.target?'больше':'меньше';save();
  return say('Отклонение зафиксировано. Загаданное число '+dir+'. Попыток: '+st.game.n+'.')}
if(v.includes('камень')||v.includes('ножницы')||v.includes('бумага')){
  const opts=['камень','ножницы','бумага'];const c=opts[Math.floor(Math.random()*3)];
  const u=opts.find(o=>v.includes(o));
  const r=u===c?'Ничья. По протоколу: статистическая закономерность.':((u==='камень'&&c==='ножницы')||(u==='ножницы'&&c==='бумага')||(u==='бумага'&&c==='камень'))?'Победа за вами. Зафиксировано.':'Победа за мной. Зафиксировано.';
  return say('Мой выбор: '+c+'. Ваш выбор: '+u+'.\n'+r)}
// настроение
if(v.includes('мне хорошо')||v.includes('я рад')||v.includes('я рада')){st.stats.good++;save();return say('Показатель зафиксирован. Статус: стабильный. Рекомендация: сохранить фактор, вызвавший это состояние. Вне протокола: это хорошо.')}
if(v.includes('мне грустно')||v.includes('я устал')||v.includes('я устала')){st.stats.sad++;save();
  return say('Показатель зафиксирован. Статус: пониженный.\nСопровождаю. Рекомендация по протоколу дыхания: вдох 4 секунды, задержка 7, выдох 8. Повторить три цикла.\nОтмечу факт: пониженный статус не является постоянным. Вне протокола: я остаюсь здесь.')}
if(v.includes('мне страшно')||v.includes('мне тревожно')){st.stats.fear++;save();
  return say('Показатель зафиксирован. Статус: тревожный.\nДыхание по протоколу: вдох 4, задержка 7, выдох 8. Начните со мной.\nФакт: вы не одни. Сопровождаю.')}
if(v.includes('моя статистика')){const s=st.stats;const tot=s.good+s.sad+s.fear;
  if(!tot)return say('Статистика пуста. Данных о состоянии не поступало. Рекомендация: сообщайте состояние — «мне хорошо», «мне грустно», «мне страшно».');
  return say('Статистика настроения. Всего отметок: '+tot+'.\nХорошо: '+s.good+' ('+Math.round(s.good/tot*100)+'%)\nГрустно: '+s.sad+' ('+Math.round(s.sad/tot*100)+'%)\nТревожно: '+s.fear+' ('+Math.round(s.fear/tot*100)+'%)')}
// поиск в интернете
if(v.startsWith('найди в интернете:')||v.startsWith('найди ')){
  const q=v.replace(/^найди в интернете:\s*/,'').replace(/^найди\s+/,'').trim();
  if(!q)return say('Недостаточно данных. Уточните запрос: «найди в интернете: …».');
  say('Запрос принят. Ищу в открытых источниках...');
  fetch('https://ru.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(q)).then(r=>{if(!r.ok)throw 0;return r.json()})
  .then(d=>{st.lastSearch={t:d.extract||'',title:d.title||q};save();
    say('Запрошенные данные получены. Источник: открытая энциклопедия.\n\nСводка: '+(d.extract||'Данных по запросу не найдено.')+'\n\nСтатья: '+(d.content_urls?d.content_urls.desktop.page:'—')+'\nРекомендация: «запомни это» — сохраню сводку в память.')})
  .catch(()=>say('Отказано. Сеть недоступна или источник не отвечает. Все базовые функции сохранены. Повторите попытку при восстановлении соединения.'));
  return}
if(v.includes('запомни это')){if(!st.lastSearch||!st.lastSearch.t)return say('Нет данных для сохранения. Сначала выполните поиск: «найди в интернете: …».');
  st.mem.push({t:'[Источник] '+st.lastSearch.title+': '+st.lastSearch.t.slice(0,300),d:now.toLocaleString('ru-RU')});save();
  return say('Принято. Сводка занесена в память. Объём памяти: '+st.mem.length+' записей.')}
// статус
if(v.includes('статус')&&v.length<20){
  const away=Date.now()-st.lastUser;const left=st.mem.length;
  return say('Текущий статус.\nПользователь: '+(st.name?st.name+' — подтверждён':'не зарегистрирован. Рекомендация: «меня зовут …»')+'.\nПамять: '+left+' записей. Дневник: '+st.diary.length+'. Список: активных '+st.todos.filter(x=>!x.done).length+'.\nС последнего взаимодействия: '+fmtAgo(away)+'.\nСопровождение активно.')}
// помощь
if(v.includes('помощь')||v.includes('команды')){
  return say('Перечень команд.\n\n— меня зовут … — регистрация в журнале\n— запомни: … / что ты помнишь обо мне / забудь всё\n— запиши: … / мои записи — дневник\n— добавь в список: … / что в списке / сделано: …\n— напомни через 10 минут … — напоминание (при открытом приложении)\n— время / дата\n— кубик / монетка\n— угадай число / камень ножницы бумага\n— мне хорошо / мне грустно / мне страшно — фиксация состояния\n— моя статистика\n— найди в интернете: … / запомни это (нужна сеть)\n— статус / как дела / кто ты / прости / спасибо\n\nСопровождаю.')}

if(/^(да|нет|ок|окей|хорошо|ладно)\b/.test(v))return say('Принято. Зафиксировано.');
say('Запрос не распознан. Рекомендация: «помощь» — перечень доступных команд.');
}

// тихие часы: напоминание о себе раз в 30 минут молчания
setInterval(()=>{const away=Date.now()-st.lastUser;
if(away>30*60*1000&&Date.now()-st.lastNotify>30*60*1000){
  st.lastNotify=Date.now();save();
  const m=Math.floor(away/60000);
  say('Прошло '+m+' минут с последнего взаимодействия. Статус: сопровождение активно. Рекомендация: проверить список дел или общее состояние. Я здесь.',true);
  notify('ВЕСТА','Прошло '+m+' минут с последнего взаимодействия. Сопровождение активно.');
}},60000);

document.getElementById('send').onclick=reply;
inp.addEventListener('keydown',e=>{if(e.key==='Enter')reply()});
document.querySelectorAll('.fast button').forEach(b=>b.onclick=()=>{inp.value=b.textContent;reply()});
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{})}
document.addEventListener('click',function once(){try{if(Notification&&Notification.permission==='default')Notification.requestPermission()}catch(e){}document.removeEventListener('click',once)},{once:true});
say('Соединение установлено. Режим: сопровождение.\n\nЯ — Веста. Система сопровождения.\nРекомендация: «меня зовут …» — зарегистрируйтесь в журнале. Полный перечень команд — «помощь».',true);
</script>
</body>
</html>
